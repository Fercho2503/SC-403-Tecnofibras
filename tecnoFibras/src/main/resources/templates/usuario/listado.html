<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}">
        <title>TecnoFibras - Usuarios</title>
    </head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>

        <div class="container mt-4">
            <div class="row">
                <div class="col">
                    <button type="button" class="btn btn-primary"
                            data-bs-toggle="modal" data-bs-target="#agregarUsuarioModal">
                        <i class="fas fa-plus"></i> Agregar Usuario
                    </button>
                </div>
            </div>
        </div>

        <div class="container mt-3">
            <div class="row">
                <div class="col-md-9">
                    <div class="card">
                        <div class="card-header bg-dark text-white">
                            <h4>Listado de Usuarios</h4>
                        </div>
                        <div class="card-body">
                            <div th:if="${usuarios != null and !usuarios.empty}">
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>Usuario</th>
                                            <th>Nombre completo</th>
                                            <th>Correo</th>
                                            <th>Rol</th>
                                            <th>Activo</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="u : ${usuarios}">
                                            <td>[[${u.idUsuario}]]</td>
                                            <td>[[${u.username}]]</td>
                                            <td>[[${u.nombre}]] [[${u.apellidos}]]</td>
                                            <td>[[${u.correo}]]</td>
                                            <td>
                                                <span class="badge bg-secondary">
                                                    [[${rolesPorUsuario.get(u.idUsuario)}]]
                                                </span>
                                            </td>
                                            <td th:text="${u.activo} ? 'Sí' : 'No'"></td>
                                            <td>
                                                <a th:href="@{/usuario/modificar/}+${u.idUsuario}"
                                                   class="btn btn-warning btn-sm">
                                                    <i class="fas fa-pencil-alt"></i> Editar
                                                </a>
                                                <form th:action="@{/usuario/eliminar}" method="post"
                                                      style="display:inline">
                                                    <input type="hidden" name="id" th:value="${u.idUsuario}"/>
                                                    <button type="submit" class="btn btn-danger btn-sm"
                                                            onclick="return confirm('¿Eliminar este usuario?')">
                                                        <i class="fas fa-trash"></i> Eliminar
                                                    </button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div th:if="${usuarios == null or usuarios.empty}" class="text-center p-3">
                                <span>No hay usuarios registrados.</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center bg-dark text-white">
                        <div class="card-body">
                            <h5>Total Usuarios</h5>
                            <p class="display-6">[[${totalUsuarios}]]</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Agregar -->
        <div class="modal fade" id="agregarUsuarioModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title"><i class="fas fa-plus"></i> Agregar Usuario</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/usuario/guardar}" th:object="${usuario}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" name="username" class="form-control" maxlength="30" required/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" name="password" class="form-control" maxlength="100" required/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" name="nombre" class="form-control" maxlength="30" required/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Apellidos</label>
                                <input type="text" name="apellidos" class="form-control" maxlength="60" required/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Correo</label>
                                <input type="email" name="correo" class="form-control" maxlength="50"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Teléfono</label>
                                <input type="text" name="telefono" class="form-control" maxlength="25"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Rol</label>
                                <select name="nombreRol" class="form-select" required>
                                    <option th:each="r : ${rolesDisponibles}" th:value="${r}" th:text="${r}"></option>
                                </select>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" name="activo" class="form-check-input" checked/>
                                <label class="form-check-label">Activo</label>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                <i class="fas fa-times"></i> Cerrar
                            </button>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <section th:replace="~{general/fragmentos :: mostrarToast}"/>
        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
