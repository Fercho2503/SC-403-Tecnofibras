<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}">
        <title>TecnoFibras - Seguimiento de Cotización</title>
    </head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>

        <div class="container mt-4">
            <div class="row">
                <div class="col-md-2"></div>
                <div class="col-md-8">

                    <div class="card mb-4">
                        <div class="card-header bg-dark text-white">
                            <h4>
                                <i class="fas fa-clipboard-list"></i>
                                Seguimiento de la Cotización #[[${idCotizacion}]]
                            </h4>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/nota-seguimiento/guardar}" th:object="${nota}" method="post" class="mb-4">
                                <input type="hidden" name="idCotizacion" th:value="${idCotizacion}"/>
                                <div class="mb-2">
                                    <label class="form-label">Nueva nota de seguimiento</label>
                                    <textarea name="comentario" class="form-control" rows="2"
                                              placeholder="Ej: Se contactó al cliente por WhatsApp, pendiente de confirmar pago..."
                                              required></textarea>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-plus"></i> Agregar nota
                                    </button>
                                </div>
                            </form>

                            <hr/>

                            <div th:if="${notas != null and !notas.empty}">
                                <div class="border-start border-3 border-danger ps-3 mb-3" th:each="n : ${notas}">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <div>
                                            <p class="mb-1">[[${n.comentario}]]</p>
                                            <small class="text-muted">
                                                <i class="fas fa-clock"></i>
                                                [[${#temporals.format(n.fecha, 'dd/MM/yyyy HH:mm')}]]
                                            </small>
                                        </div>
                                        <form th:action="@{/nota-seguimiento/eliminar}" method="post">
                                            <input type="hidden" name="id" th:value="${n.idNota}"/>
                                            <input type="hidden" name="idCotizacion" th:value="${idCotizacion}"/>
                                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                                    onclick="return confirm('¿Eliminar esta nota?')">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                            <div th:if="${notas == null or notas.empty}" class="text-center text-muted p-3">
                                Todavía no hay notas de seguimiento para esta cotización.
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <section th:replace="~{general/fragmentos :: mostrarToast}"/>
        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
