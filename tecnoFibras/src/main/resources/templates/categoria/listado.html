<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}">
        <title>TecnoFibras - Categorías</title>
    </head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>

        <!-- Botón agregar -->
        <div class="container mt-4">
            <div class="row">
                <div class="col">
                    <button type="button" class="btn btn-primary"
                            data-bs-toggle="modal" data-bs-target="#agregarCategoriaModal">
                        <i class="fas fa-plus"></i>
                        <span th:text="#{categoria.agregar}">Agregar Categoría</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Listado -->
        <div class="container mt-3">
            <div class="row">
                <div class="col-md-9">
                    <div class="card">
                        <div class="card-header bg-dark text-white">
                            <h4 th:text="#{categoria.listado}">Listado de Categorías</h4>
                        </div>
                        <div class="card-body">
                            <div th:if="${categorias != null and !categorias.empty}">
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th th:text="#{categoria.nombre}">Nombre</th>
                                            <th th:text="#{categoria.activo}">Activo</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="c : ${categorias}">
                                            <td>[[${c.idCategoria}]]</td>
                                            <td>[[${c.descripcion}]]</td>
                                            <td th:text="${c.activo} ? #{categoria.si} : #{categoria.no}"></td>
                                            <td>
                                                <a th:href="@{/categoria/modificar/}+${c.idCategoria}"
                                                   class="btn btn-warning btn-sm">
                                                    <i class="fas fa-pencil-alt"></i>
                                                    <span th:text="#{categoria.editar}">Editar</span>
                                                </a>

                                                <form th:action="@{/categoria/eliminar}" method="post"
                                                      style="display:inline">
                                                    <input type="hidden" name="id" th:value="${c.idCategoria}"/>

                                                    <button type="submit" class="btn btn-danger btn-sm"
                                                            th:onclick="'return confirm(\'' + #{categoria.confirmarEliminar} + '\')'">
                                                        <i class="fas fa-trash"></i>
                                                        <span th:text="#{categoria.eliminar}">Eliminar</span>
                                                    </button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div th:if="${categorias == null or categorias.empty}"
                                 class="text-center p-3">
                                <span th:text="#{categoria.sinRegistros}">
                                    No hay categorías registradas.
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-center bg-dark text-white">
                        <div class="card-body">
                            <h5 th:text="#{categoria.total}">Total Categorías</h5>
                            <p class="display-6">[[${totalCategorias}]]</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Agregar -->
        <div class="modal fade" id="agregarCategoriaModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title">
                            <i class="fas fa-plus"></i>
                            <span th:text="#{categoria.agregar}">Agregar Categoría</span>
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <form th:action="@{/categoria/guardar}" th:object="${categoria}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label"
                                       th:text="#{categoria.descripcion}">
                                    Descripción
                                </label>
                                <input type="text" name="descripcion"
                                       class="form-control" required/>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"
                                       th:text="#{categoria.activo}">
                                    Activo
                                </label>
                                <input type="checkbox" name="activo"
                                       class="form-check-input"/>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary"
                                    data-bs-dismiss="modal">
                                <i class="fas fa-times"></i>
                                <span th:text="#{categoria.cerrar}">Cerrar</span>
                            </button>

                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i>
                                <span th:text="#{categoria.guardar}">Guardar</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <section th:replace="~{general/fragmentos :: mostrarToast}"/>
        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
