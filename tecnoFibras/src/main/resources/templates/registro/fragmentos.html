<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

    <!-- Fragmento 1: formulario de registro -->
    <section th:fragment="nuevoUsuario">
        <div class="container py-5" style="max-width: 500px;">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-user-plus"></i>
                        [[#{registro.titulo}]]
                    </h4>
                </div>

                <div class="card-body">
                    <form th:action="@{/registro/crear}" th:object="${usuario}" method="post">

                        <div class="mb-3">
                            <label class="form-label">[[#{registro.usuario}]]</label>
                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   maxlength="30"
                                   required/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">[[#{registro.contrasena}]]</label>
                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   maxlength="100"
                                   required/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">[[#{registro.nombre}]]</label>
                            <input type="text"
                                   name="nombre"
                                   class="form-control"
                                   maxlength="30"
                                   required/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">[[#{registro.apellidos}]]</label>
                            <input type="text"
                                   name="apellidos"
                                   class="form-control"
                                   maxlength="60"
                                   required/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">[[#{registro.correo}]]</label>
                            <input type="email"
                                   name="correo"
                                   class="form-control"
                                   maxlength="50"
                                   required/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">[[#{registro.telefono}]]</label>
                            <input type="text"
                                   name="telefono"
                                   class="form-control"
                                   maxlength="25"/>
                        </div>

                        <button type="submit" class="btn btn-danger w-100">
                            <i class="fas fa-paper-plane"></i>
                            [[#{registro.registrarme}]]
                        </button>

                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Fragmento 2: mensaje de resultado (éxito o error, tanto para registrar como para activar) -->
    <section th:fragment="confirmacion">
        <div class="container py-5 text-center">
            <div th:if="${exito}">
                <i class="fas fa-check-circle fa-4x text-success mb-3"></i>
            </div>
            <div th:unless="${exito}">
                <i class="fas fa-times-circle fa-4x text-danger mb-3"></i>
            </div>
            <p class="lead">[[${mensaje}]]</p>
            <a th:href="@{/login}" class="btn btn-danger"><i class="fas fa-sign-in-alt"></i> Ir a iniciar sesión</a>
        </div>
    </section>

</html>
