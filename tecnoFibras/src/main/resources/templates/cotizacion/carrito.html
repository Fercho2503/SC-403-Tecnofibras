<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}">
        <title>TecnoFibras - Mi Cotización</title>
    </head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>

        <div class="container py-4">
            <h3><i class="fas fa-file-invoice"></i> Mi Cotización</h3>

            <div th:if="${carritoItems == null or carritoItems.empty}" class="text-center py-5">
                <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
                <p class="text-muted">Todavía no has agregado productos a tu cotización.</p>
                <a th:href="@{/catalogo}" class="btn btn-danger"><i class="fas fa-th"></i> Ir al catálogo</a>
            </div>

            <div th:if="${carritoItems != null and !carritoItems.empty}">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio unitario</th>
                            <th>Cantidad</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${carritoItems}">
                            <td>[[${item.producto.descripcion}]]</td>
                            <td>₡ [[${item.producto.precio}]]</td>
                            <td>
                                <form th:action="@{/cotizacion/actualizar}" method="post" class="d-inline-flex align-items-center">
                                    <input type="hidden" name="idProducto" th:value="${item.producto.idProducto}"/>
                                    <input type="number" name="cantidad" th:value="${item.cantidad}" min="1"
                                           class="form-control form-control-sm" style="width: 80px;"/>
                                    <button type="submit" class="btn btn-sm btn-outline-primary ms-2">
                                        <i class="fas fa-sync-alt"></i>
                                    </button>
                                </form>
                            </td>
                            <td>
                                <form th:action="@{/cotizacion/eliminar}" method="post">
                                    <input type="hidden" name="idProducto" th:value="${item.producto.idProducto}"/>
                                    <button type="submit" class="btn btn-sm btn-danger"
                                            onclick="return confirm('¿Quitar este producto?')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/catalogo}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i> Seguir viendo catálogo
                    </a>
                    <form th:action="@{/cotizacion/enviar}" method="post">
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-paper-plane"></i> Enviar Cotización
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <section th:replace="~{general/fragmentos :: mostrarToast}"/>
        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
