<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}">
        <title>TecnoFibras - Cotizaciones</title>
    </head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>

        <div class="container mt-4">
            <div class="row">
                <div class="col-md-9">
                    <div class="card">
                        <div class="card-header bg-dark text-white">
                            <h4>Listado de Cotizaciones</h4>
                        </div>
                        <div class="card-body">
                            <div th:if="${cotizaciones != null and !cotizaciones.empty}">
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>Cliente</th>
                                            <th>Fecha</th>
                                            <th>Estado</th>
                                            <th>Vendedor</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="c : ${cotizaciones}">
                                            <td>[[${c.idCotizacion}]]</td>
                                            <td>[[${c.usuario.nombre}]] [[${c.usuario.apellidos}]]</td>
                                            <td th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                                            <td>
                                                <span class="badge"
                                                      th:classappend="${c.estado == 'Pendiente'} ? 'bg-warning text-dark' : (${c.estado == 'Finalizada'} ? 'bg-success' : 'bg-info text-dark')"
                                                      th:text="${c.estado}"></span>
                                            </td>
                                            <td th:text="${c.vendedor != null} ? ${c.vendedor.nombre} : 'Sin asignar'"></td>
                                            <td>
                                                <a th:href="@{/cotizacion/detalle/}+${c.idCotizacion}" class="btn btn-primary btn-sm">
                                                    <i class="fas fa-eye"></i> Ver detalle
                                                </a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div th:if="${cotizaciones == null or cotizaciones.empty}" class="text-center p-3">
                                <span>No hay cotizaciones registradas.</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center bg-dark text-white">
                        <div class="card-body">
                            <h5>Total Cotizaciones</h5>
                            <p class="display-6">[[${totalCotizaciones}]]</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <section th:replace="~{general/fragmentos :: mostrarToast}"/>
        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
