<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}">
        <title>TecnoFibras - Contacto</title>
    </head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>

        <div class="container mt-5">
            <div class="row">
                <div class="col-md-2"></div>
                <div class="col-md-8">
                    <div class="card shadow">
                        <div class="card-header bg-dark text-white">
                            <h4><i class="fas fa-envelope"></i> [[#{contacto.titulo}]]</h4>
                        </div>
                        <div class="card-body">
                            <form method="post" th:action="@{/contacto}">
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{contacto.nombre}"></label>
                                    <input type="text" class="form-control"
                                           th:placeholder="#{contacto.nombrePlaceholder}" required/>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{contacto.correo}"></label>
                                    <input type="email" class="form-control"
                                           placeholder="correo@ejemplo.com" required/>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{contacto.mensaje}"></label>
                                    <textarea class="form-control" rows="4"
                                              th:placeholder="#{contacto.mensajePlaceholder}" required></textarea>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-dark">
                                        <i class="fas fa-paper-plane"></i> [[#{contacto.enviar}]]
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="card shadow mt-4">
                        <div class="card-header bg-dark text-white">
                            <h4><i class="fas fa-map-marker-alt"></i> [[#{contacto.infoTitulo}]]</h4>
                        </div>
                        <div class="card-body">
                            <p><i class="fas fa-map-marker-alt"></i>
                                <strong>[[#{contacto.direccion}]]:</strong> Naranjo, Alajuela, Costa Rica</p>
                            <p><i class="fas fa-phone"></i>
                                <strong>[[#{contacto.telefono}]]:</strong> 2451-0000</p>
                            <p><i class="fas fa-envelope"></i>
                                <strong>[[#{contacto.correo}]]:</strong> info@tecnofibrastfcr.com</p>
                            <p><i class="fas fa-clock"></i>
                                <strong>[[#{contacto.horario}]]:</strong> [[#{contacto.horarioValor}]]</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <section th:replace="~{general/fragmentos :: mostrarToast}"/>
        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
