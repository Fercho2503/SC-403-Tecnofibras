<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos :: head}">
        <title>TecnoFibras - Detalle</title>
    </head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>

        <div class="container py-4">
            <a th:href="@{/catalogo}" class="btn btn-outline-danger mb-3">
                <i class="fas fa-arrow-left"></i> Volver al catálogo
            </a>
            <div class="row">
                <div class="col-md-5">
                    <img th:src="${producto.rutaImagen != null and !#strings.isEmpty(producto.rutaImagen)} ? ${producto.rutaImagen} : 'https://via.placeholder.com/500x400?text=Sin+imagen'"
                         class="img-fluid rounded shadow-sm" alt="imagen producto"/>
                </div>
                <div class="col-md-7">
                    <h2>[[${producto.descripcion}]]</h2>
                    <span class="badge bg-secondary mb-3">[[${producto.categoria.descripcion}]]</span>

                    <div th:if="${descuentos.containsKey(producto.idProducto)}">
                        <span class="badge bg-danger fs-6 mb-2"
                              th:text="'-' + ${descuentos.get(producto.idProducto)} + '% de descuento'"></span>
                        <p class="mb-0">
                            <span class="text-decoration-line-through text-muted fs-5">₡ [[${producto.precio}]]</span>
                        </p>
                        <p class="fs-3 text-danger fw-bold"
                           th:text="'₡ ' + ${#numbers.formatDecimal(producto.precio * (1 - descuentos.get(producto.idProducto) / 100), 1, 2)}"></p>
                    </div>
                    <p class="fs-3 text-danger fw-bold" th:unless="${descuentos.containsKey(producto.idProducto)}">
                        ₡ [[${producto.precio}]]
                    </p>

                    <form th:action="@{/cotizacion/agregar}" method="post" sec:authorize="hasRole('CLIENTE')" class="mb-3">
                        <input type="hidden" name="idProducto" th:value="${producto.idProducto}"/>
                        <button type="submit" class="btn btn-outline-danger">
                            <i class="fas fa-cart-plus"></i> Agregar a cotización
                        </button>
                    </form>

                    <ul class="list-group">
                        <li class="list-group-item" th:if="${producto.medidas != null}">
                            <strong>Medidas:</strong> [[${producto.medidas}]]
                        </li>
                        <li class="list-group-item" th:if="${producto.galonaje != null}">
                            <strong>Galonaje:</strong> [[${producto.galonaje}]]
                        </li>
                        <li class="list-group-item" th:if="${producto.capacidad != null}">
                            <strong>Capacidad:</strong> [[${producto.capacidad}]]
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
