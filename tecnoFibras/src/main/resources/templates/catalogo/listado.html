<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}">
        <title>TecnoFibras - Catálogo</title>
    </head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>
        <div class="container py-4">
            <!-- Filtros por categoría -->
            <div class="row mb-3">
                <div class="col text-center">
                    <a th:href="@{/catalogo(precioMin=${precioMin}, precioMax=${precioMax})}"
                       th:class="${categoriaSeleccionada == 0} ? 'btn btn-danger me-2' : 'btn btn-outline-danger me-2'">
                        <i class="fas fa-th"></i> Todos
                    </a>
                    <a th:each="c : ${categorias}"
                       th:href="@{/catalogo(categoriaId=${c.idCategoria}, precioMin=${precioMin}, precioMax=${precioMax})}"
                       th:class="${categoriaSeleccionada == c.idCategoria} ? 'btn btn-danger me-2' : 'btn btn-outline-danger me-2'">
                        [[${c.descripcion}]]
                    </a>
                </div>
            </div>

            <!-- Filtro por rango de precio -->
            <div class="row mb-4">
                <div class="col">
                    <form th:action="@{/catalogo}" method="get" class="row g-2 justify-content-center align-items-end">
                        <input type="hidden" name="categoriaId"
                               th:value="${categoriaSeleccionada != 0} ? ${categoriaSeleccionada} : null"/>
                        <div class="col-auto">
                            <label class="form-label mb-0">Precio mínimo</label>
                            <input type="number" step="0.01" min="0" name="precioMin" class="form-control"
                                   th:value="${precioMin}" placeholder="₡ 0"/>
                        </div>
                        <div class="col-auto">
                            <label class="form-label mb-0">Precio máximo</label>
                            <input type="number" step="0.01" min="0" name="precioMax" class="form-control"
                                   th:value="${precioMax}" placeholder="₡ 999999"/>
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-filter"></i> Filtrar
                            </button>
                        </div>
                        <div class="col-auto" th:if="${precioMin != null or precioMax != null}">
                            <a th:href="@{/catalogo(categoriaId=${categoriaSeleccionada != 0} ? ${categoriaSeleccionada} : null)}"
                               class="btn btn-outline-secondary">
                                <i class="fas fa-times"></i> Quitar filtro de precio
                            </a>
                        </div>
                    </form>
                </div>
            </div>
            <!-- Listado de productos -->
            <div class="row g-4" th:if="${productos != null and !productos.empty}">
                <div class="col-md-3" th:each="p : ${productos}">
                    <div class="card h-100 shadow-sm">
                        <img th:src="${p.rutaImagen != null and !#strings.isEmpty(p.rutaImagen)} ? ${p.rutaImagen} : 'https://via.placeholder.com/300x200?text=Sin+imagen'"
                             class="card-img-top" alt="imagen producto" style="height: 200px; object-fit: cover;"/>
                        <div class="card-body">
                            <h5 class="card-title">[[${p.descripcion}]]</h5>
                            <p class="fw-bold text-danger">₡ [[${p.precio}]]</p>
                            <span class="badge bg-secondary">[[${p.categoria.descripcion}]]</span>
                        </div>
                        <div class="card-footer">
                            <a th:href="@{/catalogo/producto/}+${p.idProducto}"
                               class="btn btn-danger btn-sm w-100">
                                <i class="fas fa-eye"></i> Ver detalle
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${productos == null or productos.empty}" class="text-center py-5">
                <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
                <p class="text-muted">No hay productos disponibles.</p>
            </div>
        </div>
        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
