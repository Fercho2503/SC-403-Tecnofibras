<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos :: head}">
        <title>TecnoFibras - Catálogo</title>
    </head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>
        <div class="container py-4">
            <!-- Filtros por categoría -->
            <div class="row mb-3">
                <div class="col text-center">
                    <a th:href="@{/catalogo(precioMin=${precioMin}, precioMax=${precioMax})}"
                       th:class="${categoriaSeleccionada == 0} ? 'btn btn-danger me-2' : 'btn btn-outline-danger me-2'">
                        <i class="fas fa-th"></i> <span th:text="#{catalogo.todos}"></span>
                    </a>
                    <a th:each="c : ${categorias}"
                       th:href="@{/catalogo(categoriaId=${c.idCategoria}, precioMin=${precioMin}, precioMax=${precioMax})}"
                       th:class="${categoriaSeleccionada == c.idCategoria} ? 'btn btn-danger me-2' : 'btn btn-outline-danger me-2'">
                        [[${c.descripcion}]]
                    </a>
                </div>
            </div>

            <!-- Filtro por rango de precio -->
            <div class="row mb-4">
                <div class="col">
                    <form th:action="@{/catalogo}" method="get" class="row g-2 justify-content-center align-items-end">
                        <input type="hidden" name="categoriaId"
                               th:value="${categoriaSeleccionada != 0} ? ${categoriaSeleccionada} : null"/>
                        <div class="col-auto">
                            <label class="form-label mb-0" th:text="#{catalogo.precioMinimo}"></label>
                            <input type="number" step="0.01" min="0" name="precioMin" class="form-control"
                                   th:value="${precioMin}" placeholder="₡ 0"/>
                        </div>
                        <div class="col-auto">
                            <label class="form-label mb-0" th:text="#{catalogo.precioMaximo}"></label>
                            <input type="number" step="0.01" min="0" name="precioMax" class="form-control"
                                   th:value="${precioMax}" placeholder="₡ 999999"/>
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-filter"></i> <span th:text="#{catalogo.filtrar}"></span>
                            </button>
                        </div>
                        <div class="col-auto" th:if="${precioMin != null or precioMax != null}">
                            <a th:href="@{/catalogo(categoriaId=${categoriaSeleccionada != 0} ? ${categoriaSeleccionada} : null)}"
                               class="btn btn-outline-secondary">
                                <i class="fas fa-times"></i> <span th:text="#{catalogo.quitarFiltroPrecio}"></span>
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Listado de productos -->
            <div class="row g-4" th:if="${productos != null and !productos.empty}">
                <div class="col-md-3" th:each="p : ${productos}">
                    <div class="card h-100 shadow-sm">
                        <span th:if="${descuentos.containsKey(p.idProducto)}"
                              class="badge bg-danger position-absolute m-2"
                              th:text="'-' + ${descuentos.get(p.idProducto)} + '%'"></span>
                        <img th:src="${p.rutaImagen != null and !#strings.isEmpty(p.rutaImagen)} ? ${p.rutaImagen} : 'https://via.placeholder.com/300x200?text=Sin+imagen'"
                             class="card-img-top" th:alt="#{catalogo.sinImagen}" style="height: 200px; object-fit: cover;"/>
                        <div class="card-body">
                            <h5 class="card-title">[[${p.descripcion}]]</h5>
                            <div th:if="${descuentos.containsKey(p.idProducto)}">
                                <p class="mb-0">
                                    <span class="text-decoration-line-through text-muted">₡ [[${p.precio}]]</span>
                                </p>
                                <p class="fw-bold text-danger fs-5"
                                   th:text="'₡ ' + ${#numbers.formatDecimal(p.precio * (1 - descuentos.get(p.idProducto) / 100), 1, 2)}"></p>
                            </div>
                            <p class="fw-bold text-danger" th:unless="${descuentos.containsKey(p.idProducto)}">
                                ₡ [[${p.precio}]]
                            </p>
                            <span class="badge bg-secondary">[[${p.categoria.descripcion}]]</span>
                        </div>
                        <div class="card-footer">
                            <a th:href="@{/catalogo/producto/}+${p.idProducto}"
                               class="btn btn-danger btn-sm w-100 mb-1">
                                <i class="fas fa-eye"></i> <span th:text="#{catalogo.verDetalle}"></span>
                            </a>
                            <form th:action="@{/cotizacion/agregar}" method="post" sec:authorize="hasRole('CLIENTE')">
                                <input type="hidden" name="idProducto" th:value="${p.idProducto}"/>
                                <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                                    <i class="fas fa-cart-plus"></i> <span th:text="#{catalogo.agregarCotizacion}"></span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${productos == null or productos.empty}" class="text-center py-5">
                <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
                <p class="text-muted" th:text="#{catalogo.noProductos}"></p>
            </div>
        </div>
        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
