<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <!-- Fragmento #1 head -->
    <head th:fragment="head">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>TecnoFibras</title>
        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
        <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
        <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
    </head>

    <!-- Fragmento #2 header -->
    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
            <div class="container">
                <a class="navbar-brand fw-bold" th:href="@{/}">
                    TecnoFibras
                </a>
                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}">[[#{general.inicio}]]</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/catalogo}">[[#{general.catalogo}]]</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                            <a class="nav-link" th:href="@{/categoria/listado}">[[#{general.categorias}]]</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                            <a class="nav-link" th:href="@{/producto/listado}">[[#{general.productos}]]</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                            <a class="nav-link" th:href="@{/usuario/listado}">[[#{general.usuarios}]]</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                            <a class="nav-link" th:href="@{/promocion/listado}">[[#{general.promociones}]]</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyRole('VENDEDOR','ADMINISTRADOR')">
                            <a class="nav-link" th:href="@{/cotizacion/listado}">[[#{general.cotizaciones}]]</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('CLIENTE')">
                            <a class="nav-link" th:href="@{/cotizacion/carrito}">
                                <i class="fas fa-file-invoice"></i> [[#{general.miCotizacion}]]
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('CLIENTE')">
                            <a class="nav-link" th:href="@{/cotizacion/mis}">[[#{general.misCotizaciones}]]</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/contacto}">[[#{general.contacto}]]</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                                <i class="fas fa-globe"></i> [[#{general.idioma}]]
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" th:href="@{''(lang=es)}">Espa\u00f1ol</a></li>
                                <li><a class="dropdown-item" th:href="@{''(lang=en)}">English</a></li>
                            </ul>
                        </li>
                        <li class="nav-item" sec:authorize="!isAuthenticated()">
                            <a class="nav-link" th:href="@{/login}">
                                <i class="fas fa-sign-in-alt"></i> [[#{general.iniciarSesion}]]
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="!isAuthenticated()">
                            <a class="nav-link" th:href="@{/registro/nuevo}">
                                <i class="fas fa-user-plus"></i> [[#{general.registrate}]]
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <span class="nav-link text-white">
                                <i class="fas fa-user"></i> <span sec:authentication="name"></span>
                            </span>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <form method="post" th:action="@{/logout}">
                                <button class="btn nav-link text-white" type="submit">
                                    <i class="fas fa-sign-out-alt"></i> [[#{general.salir}]]
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <section class="py-2 bg-danger text-white text-center">
            <h1>TecnoFibras</h1>
        </section>
    </header>

    <!-- Fragmento #3 footer -->
    <footer th:fragment="footer" class="text-white py-4 mt-5 bg-danger">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>TecnoFibras</h5>
                </div>
                <div class="col-md-6 text-md-end">
                    <h6>[[#{general.redesSociales}]]</h6>
                    <a href="https://www.facebook.com/tecnofibrastfcr" target="_blank"
                       class="text-white me-3 fs-4">
                        <i class="fa-brands fa-facebook"></i>
                    </a>
                    <a href="https://www.instagram.com/tecnofibras.tfcr/" target="_blank"
                       class="text-white me-3 fs-4">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://www.linkedin.com/company/tecnofibrastfcr/" target="_blank"
                       class="text-white fs-4">
                        <i class="fa-brands fa-linkedin"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Fragmento #4 mostrarToast -->
    <section th:fragment="mostrarToast">
        <div aria-live="polite" aria-atomic="true"
             class="position-fixed top-50 start-50 translate-middle" style="z-index: 1080;">
            <div th:if="${error}" class="toast show" role="alert">
                <div class="toast-header text-white bg-danger">
                    <i class="fa-solid fa-bomb"></i>
                    <strong class="me-auto" th:text="' ' + #{toast.error}"></strong>
                </div>
                <div class="toast-body">
                    <p>[[${error}]]</p>
                    <div class="mt-2 pt-2 border-top text-center">
                        <button type="button" class="btn btn-secondary btn-sm"
                                data-bs-dismiss="toast">[[#{general.cerrar}]]</button>
                    </div>
                </div>
            </div>
            <div th:if="${todoOk}" class="toast show" role="status">
                <div class="toast-header text-white bg-success">
                    <i class="fa-solid fa-square-check"></i>
                    <strong class="me-auto" th:text="' ' + #{toast.exito}"></strong>
                </div>
                <div class="toast-body">
                    <p>[[${todoOk}]]</p>
                    <div class="mt-2 pt-2 border-top text-center">
                        <button type="button" class="btn btn-secondary btn-sm"
                                data-bs-dismiss="toast">[[#{general.cerrar}]]</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

</html>
